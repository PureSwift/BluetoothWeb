name: Build
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install Swift SDK for WebAssembly
      uses: swiftwasm/setup-swiftwasm@v2
    - name: Build
      run: swift build --swift-sdk wasm32-unknown-wasi
